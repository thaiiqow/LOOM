<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0914">
<title>Волна</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫧</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --c1:#ff5a7a;--c2:#7c5cff;--c3:#38d6ff;--bass:0;
  --bg:#0a0914;--text:#fff;--muted:rgba(255,255,255,.62);
  --g1:rgba(255,255,255,.26);--g2:rgba(255,255,255,.07);--g3:rgba(255,255,255,.14);
  --edge:rgba(255,255,255,.65);--border:rgba(255,255,255,.28);--shadow:rgba(0,0,0,.28);
  --field:rgba(0,0,0,.18);--fieldb:rgba(255,255,255,.12);--hover:rgba(255,255,255,.14);--track:rgba(255,255,255,.25);
  --btn:#fff;--btnfg:#14102a;--blobop:.75;
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#eef0fb;--text:#1a1730;--muted:rgba(26,23,48,.62);
  --g1:rgba(255,255,255,.75);--g2:rgba(255,255,255,.3);--g3:rgba(255,255,255,.5);
  --edge:rgba(255,255,255,.95);--border:rgba(255,255,255,.85);--shadow:rgba(70,60,140,.2);
  --field:rgba(255,255,255,.6);--fieldb:rgba(26,23,48,.1);--hover:rgba(26,23,48,.07);--track:rgba(26,23,48,.16);
  --btn:#1a1730;--btnfg:#fff;--blobop:.6;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);transition:background .4s,color .4s;font:500 15px/1.4 Manrope,system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--text);outline-offset:3px}
svg{width:1em;height:1em;fill:currentColor;display:block}

/* фон: три цветных пятна, цвета меняются вместе с музыкой */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--blobop);transition:transform .25s ease-out}
.bg i:nth-child(1){width:70vmax;height:70vmax;left:-25vmax;top:-20vmax;background:var(--c1);transform:scale(calc(1 + var(--bass)*.25))}
.bg i:nth-child(2){width:60vmax;height:60vmax;right:-25vmax;top:20vh;background:var(--c2);transform:scale(calc(1 + var(--bass)*.18))}
.bg i:nth-child(3){width:55vmax;height:55vmax;left:5vmax;bottom:-30vmax;background:var(--c3);transform:scale(calc(1 + var(--bass)*.3))}

/* Liquid Glass */
.glass{
  background:linear-gradient(145deg,var(--g1),var(--g2) 55%,var(--g3));
  -webkit-backdrop-filter:blur(26px) saturate(190%) brightness(1.08);backdrop-filter:blur(26px) saturate(190%) brightness(1.08);
  border:1px solid var(--border);
  box-shadow:inset 0 1.5px 0 var(--edge),inset 0 -1.5px 0 rgba(255,255,255,.12),inset 1.5px 0 0 rgba(255,255,255,.2),0 14px 44px var(--shadow);
}
.top,.stage,.dock{position:relative;z-index:2}

.top{margin:12px 14px 0;padding:8px 8px 8px 18px;border-radius:999px;display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.03em}
.top input{flex:1;min-width:0;background:var(--field);border:1px solid var(--fieldb);color:var(--text);padding:10px 16px;border-radius:999px;font:inherit}
.top input::placeholder{color:var(--muted)}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:8px 20px}
.orbwrap{position:relative;width:min(84vw,46vh,440px);aspect-ratio:1;border-radius:50%}
#orb{width:100%;height:100%;display:block;border-radius:50%;cursor:pointer}
.state{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:32px;pointer-events:none;
  opacity:0;transform:scale(.7);transition:opacity .3s,transform .3s}
.paused .state{opacity:1;transform:scale(1)}
.meta{text-align:center;max-width:100%;min-width:0}
.meta .t{font-weight:800;font-size:clamp(20px,5vw,28px);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .a{color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dock{margin:0 14px 14px;padding:12px 16px 14px;border-radius:32px}
.seek{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--text) var(--p,0%),var(--track) var(--p,0%));outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--text)}
.ctrl{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.ctrl .ibtn{font-size:22px;transition:transform .15s}
.ctrl .ibtn:active{transform:scale(.9)}
.ctrl .main{width:60px;height:60px;font-size:26px;background:var(--btn);color:var(--btnfg);box-shadow:0 8px 24px rgba(0,0,0,.3)}
#like.on{color:var(--c1)}
#like.on svg{filter:drop-shadow(0 0 8px var(--c1))}

/* список — стеклянная шторка */
.sheet{position:fixed;left:10px;right:10px;bottom:10px;height:72vh;z-index:5;border-radius:32px;padding:14px 8px 8px;display:flex;flex-direction:column;
  transform:translateY(110%);transition:transform .45s cubic-bezier(.2,.9,.25,1)}
.sheet.open{transform:none}
.sheet header{display:flex;gap:8px;padding:0 8px 10px;align-items:center}
.tab{padding:8px 16px;border-radius:999px;color:var(--muted);font-weight:700}
.tab[aria-selected=true]{background:var(--btn);color:var(--btnfg)}
.sheet header .ibtn{margin-left:auto;width:38px;height:38px}
.list{overflow-y:auto;flex:1;padding:0 4px}
.row{display:flex;align-items:center}
.track{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;text-align:left}
.track:hover,.track.on{background:var(--hover)}
.cover{width:48px;height:48px;border-radius:12px;background:var(--hover) center/cover;flex:none}
.info{flex:1;min-width:0}
.info .t,.info .a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .t{font-weight:700}.info .a{color:var(--muted);font-size:13px}
.dur{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.lk{width:40px;height:40px;display:grid;place-items:center;font-size:20px;color:var(--muted)}
.lk.on{color:var(--c1)}
.msg{padding:24px 12px;color:var(--muted)}
.pop{position:fixed;z-index:6;right:14px;top:calc(env(safe-area-inset-top,0px) + 78px);width:min(310px,calc(100vw - 28px));padding:16px;border-radius:26px;
  opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity .25s,transform .25s}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.lbl{font-weight:700;margin:0 2px 8px}.lbl+.sw,.lbl~.lbl{margin-top:0}.lbl~.lbl{margin-top:16px}
.seg{display:flex;padding:4px;border-radius:999px;background:var(--field);gap:4px}
.seg button{flex:1;padding:9px;border-radius:999px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--btn);color:var(--btnfg)}
.sw{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw .auto{padding:8px 14px;border-radius:999px;background:var(--field);font-weight:700}
.dot{width:32px;height:32px;border-radius:50%;background:hsl(var(--h,0) 95% 58%);box-shadow:0 0 14px hsl(var(--h,0) 95% 58% / .7);position:relative;cursor:pointer}
.dot.pick{background:conic-gradient(#ff3b6b,#ffb02e,#4dff7a,#2ee6ff,#6a5cff,#ff3bd4,#ff3b6b);box-shadow:none;overflow:hidden}
.dot.pick input{position:absolute;inset:-6px;width:44px;height:44px;opacity:0;cursor:pointer}
.sw [aria-pressed=true]{outline:2px solid var(--text);outline-offset:3px}
@media(max-width:480px){#openList{display:none}}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="top glass">
  <div class="logo">Волна</div>
  <input id="q" type="search" placeholder="Трек или исполнитель" aria-label="Поиск">
  <button class="ibtn glass" id="setBtn" aria-label="Оформление" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 2v14a7 7 0 0 1 0-14z"/></svg></button>
  <button class="ibtn glass" id="openList" aria-label="Открыть список"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg></button>
</div>

<div class="pop glass" id="pop" role="dialog" aria-label="Оформление">
  <div class="lbl">Тема</div>
  <div class="seg"><button data-th="dark">Тёмная</button><button data-th="light">Светлая</button></div>
  <div class="lbl">Цвет неона</div>
  <div class="sw" id="sw"></div>
</div>

<div class="stage paused" id="stage">
  <div class="orbwrap">
    <canvas id="orb" role="button" tabindex="0" aria-label="Играть или пауза"></canvas>
    <div class="state glass" id="stateIcon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
  </div>
  <div class="meta"><div class="t" id="pt">Нажмите на шар</div><div class="a" id="pa">и музыка заиграет</div></div>
</div>

<div class="dock glass">
  <div class="seek"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Перемотка"><span id="tot">0:00</span></div>
  <div class="ctrl">
    <button class="ibtn" id="like" aria-label="В избранное"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C1 8.4 3 5 6.3 5c2 0 3.5 1.1 5.7 3.3C14.200 6.100 15.700 5 17.700 5 21 5 23 8.400 21.600 11.700 19.500 16.400 12 21 12 21z"/></svg></button>
    <button class="ibtn" id="prev" aria-label="Предыдущий"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.500 6L18 18V6z"/></svg></button>
    <button class="ibtn main" id="play" aria-label="Играть"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="ibtn" id="next" aria-label="Следующий"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.500-6L6 6z"/></svg></button>
    <button class="ibtn" id="listBtn" aria-label="Список треков"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg></button>
  </div>
</div>

<section class="sheet glass" id="sheet" aria-label="Список треков">
  <header>
    <button class="tab" id="tabTrend" aria-selected="true">В тренде</button>
    <button class="tab" id="tabLikes" aria-selected="false">Избранное</button>
    <button class="ibtn glass" id="closeList" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6.400 5 5 6.400 10.600 12 5 17.600 6.400 19l5.600-5.600 5.600 5.600 1.400-1.400L13.400 12 19 6.400 17.600 5 12 10.600z"/></svg></button>
  </header>
  <div class="list" id="list"></div>
</section>

<audio id="audio" preload="none"></audio>

<script>
const API = "https://api.audius.co/v1", APP = "volna-player";
const $ = id => document.getElementById(id);
const audio = $("audio");
const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>'
};
let tracks = [], idx = -1, mode = "trend";
let likes = [];
try { likes = JSON.parse(localStorage.getItem("volna-likes") || "[]"); } catch (e) {}
const saveLikes = () => { try { localStorage.setItem("volna-likes", JSON.stringify(likes)); } catch (e) {} };
const isLiked = t => t && likes.some(l => l.id === t.id);
const fmt = s => { s = Math.floor(s || 0); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = t => ({ id: t.id, title: t.title, artist: t.user?.name || "", art: t.artwork?.["150x150"] || "", duration: t.duration || 0 });

/* ---------- данные ---------- */
async function load(path) {
  $("list").innerHTML = '<div class="msg">Загрузка…</div>';
  try {
    const r = await fetch(`${API}${path}${path.includes("?") ? "&" : "?"}app_name=${APP}`);
    if (!r.ok) throw 0;
    tracks = ((await r.json()).data || []).filter(t => t.is_streamable !== false).map(norm);
    idx = -1; renderList();
  } catch (e) {
    $("list").innerHTML = '<div class="msg">Не удалось загрузить треки. Проверьте интернет и повторите.</div>';
  }
}
function renderList() {
  if (!tracks.length) { $("list").innerHTML = '<div class="msg">' + (mode === "likes" ? "Нажмите на сердце у трека, и он появится здесь." : "Ничего не найдено.") + "</div>"; return; }
  $("list").innerHTML = tracks.map((t, i) => `<div class="row">
    <button class="track ${i === idx ? "on" : ""}" data-i="${i}">
      <div class="cover" style="${t.art ? `background-image:url('${t.art}')` : ""}"></div>
      <div class="info"><div class="t">${esc(t.title)}</div><div class="a">${esc(t.artist)}</div></div>
      <div class="dur">${fmt(t.duration)}</div></button>
    <button class="lk ${isLiked(t) ? "on" : ""}" data-l="${i}" aria-label="В избранное">${isLiked(t) ? "♥" : "♡"}</button></div>`).join("");
}
$("list").addEventListener("click", e => {
  const l = e.target.closest("[data-l]");
  if (l) { toggleLike(tracks[+l.dataset.l]); return; }
  const b = e.target.closest("[data-i]");
  if (b) { playAt(+b.dataset.i); closeSheet(); }
});
function toggleLike(t) {
  if (!t) return;
  likes = isLiked(t) ? likes.filter(x => x.id !== t.id) : [...likes, t];
  saveLikes();
  if (mode === "likes") { const cur = tracks[idx]; tracks = [...likes]; idx = cur ? tracks.findIndex(x => x.id === cur.id) : -1; }
  renderList(); syncLike();
}
function syncLike() { $("like").classList.toggle("on", isLiked(tracks[idx])); }
$("like").onclick = () => toggleLike(tracks[idx]);

/* ---------- плеер ---------- */
let fake = false, ctx, analyser, srcNode, data = new Uint8Array(128);
audio.crossOrigin = "anonymous";

function playAt(i) {
  if (i < 0 || i >= tracks.length) return;
  idx = i; const t = tracks[i];
  audio.src = `${API}/tracks/${t.id}/stream?app_name=${APP}`;
  audio.play().catch(() => {});
  $("pt").textContent = t.title; $("pa").textContent = t.artist;
  document.title = `${t.title} — Волна`;
  setPaletteFromArt(t); renderList(); syncLike();
  if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, artwork: t.art ? [{ src: t.art }] : [] });
}
function toggle() {
  if (idx < 0) { if (tracks.length) playAt(0); return; }
  audio.paused ? audio.play() : audio.pause();
}
audio.addEventListener("playing", () => {
  if (fake || srcNode) return;
  try { // анализатор работает, только если сервер разрешил CORS
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    srcNode = ctx.createMediaElementSource(audio);
    analyser = ctx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = .7;
    srcNode.connect(analyser); analyser.connect(ctx.destination);
  } catch (e) { fake = true; }
});
audio.addEventListener("play", () => { if (ctx && ctx.state === "suspended") ctx.resume(); });
audio.onerror = () => {
  if (!srcNode && audio.crossOrigin) { // без CORS: играем как есть, шар анимируем без анализа звука
    fake = true; audio.removeAttribute("crossorigin");
    if (idx >= 0) { audio.src = `${API}/tracks/${tracks[idx].id}/stream?app_name=${APP}`; audio.play().catch(() => {}); }
  } else if (idx >= 0) $("next").click();
};
function syncPlayState() {
  const p = !audio.paused;
  $("stage").classList.toggle("paused", !p);
  $("play").innerHTML = p ? ICON.pause : ICON.play;
  $("stateIcon").innerHTML = ICON.play;
}
audio.onplay = audio.onpause = syncPlayState;
audio.onended = () => $("next").click();
audio.ontimeupdate = () => {
  const p = audio.duration ? audio.currentTime / audio.duration * 100 : 0;
  $("seek").value = p; $("seek").style.setProperty("--p", p + "%");
  $("cur").textContent = fmt(audio.currentTime); $("tot").textContent = fmt(audio.duration);
};
$("seek").oninput = e => { if (audio.duration) audio.currentTime = e.target.value / 100 * audio.duration; };
$("play").onclick = toggle;
$("orb").onclick = toggle;
$("orb").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
$("next").onclick = () => tracks.length && playAt((idx + 1) % tracks.length);
$("prev").onclick = () => audio.currentTime > 3 ? (audio.currentTime = 0) : tracks.length && playAt((idx - 1 + tracks.length) % tracks.length);
if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", () => audio.play());
  navigator.mediaSession.setActionHandler("pause", () => audio.pause());
  navigator.mediaSession.setActionHandler("nexttrack", () => $("next").click());
  navigator.mediaSession.setActionHandler("previoustrack", () => $("prev").click());
}

/* ---------- шторка, вкладки, поиск ---------- */
const openSheet = () => $("sheet").classList.add("open");
const closeSheet = () => $("sheet").classList.remove("open");
$("openList").onclick = $("listBtn").onclick = openSheet;
$("closeList").onclick = closeSheet;
function setTab(m) {
  mode = m; $("q").value = "";
  $("tabTrend").setAttribute("aria-selected", m === "trend");
  $("tabLikes").setAttribute("aria-selected", m === "likes");
  if (m === "likes") { tracks = [...likes]; idx = -1; renderList(); } else load("/tracks/trending");
}
$("tabTrend").onclick = () => setTab("trend");
$("tabLikes").onclick = () => setTab("likes");
let timer;
$("q").oninput = e => {
  clearTimeout(timer); const v = e.target.value.trim();
  timer = setTimeout(() => {
    if (!v) return setTab("trend");
    mode = "search"; openSheet();
    $("tabTrend").setAttribute("aria-selected", false); $("tabLikes").setAttribute("aria-selected", false);
    load(`/tracks/search?query=${encodeURIComponent(v)}`);
  }, 400);
};

/* ---------- оформление: тема и неон ---------- */
const PREF_KEY = "volna-prefs", PRESETS = [330, 355, 25, 55, 140, 185, 215, 265];
let prefs = { theme: matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark", neon: null };
try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY) || "{}")); } catch (e) {}
const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {} };
let isLight = false;
function applyTheme() {
  isLight = prefs.theme === "light";
  document.documentElement.dataset.theme = prefs.theme;
  document.querySelector("meta[name=theme-color]").content = isLight ? "#eef0fb" : "#0a0914";
  document.querySelectorAll("[data-th]").forEach(b => b.setAttribute("aria-pressed", b.dataset.th === prefs.theme));
}
function buildSwatches() {
  $("sw").innerHTML = '<button class="auto" data-n="auto">Авто</button>' +
    PRESETS.map(h => `<button class="dot" data-n="${h}" style="--h:${h}" aria-label="Неон, оттенок ${h}"></button>`).join("") +
    '<label class="dot pick" aria-label="Свой цвет"><input type="color" id="cust" value="#ff5a7a"></label>';
}
function markSw() {
  document.querySelectorAll("#sw [data-n]").forEach(b => b.setAttribute("aria-pressed", b.dataset.n === "auto" ? prefs.neon === null : +b.dataset.n === prefs.neon));
  $("sw").querySelector(".pick").setAttribute("aria-pressed", prefs.neon !== null && !PRESETS.includes(prefs.neon));
}
function hexToHue(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255, gr = parseInt(hex.slice(3, 5), 16) / 255, bl = parseInt(hex.slice(5, 7), 16) / 255;
  const mx = Math.max(r, gr, bl), s = mx - Math.min(r, gr, bl);
  if (!s) return hue;
  const h = mx === r ? ((gr - bl) / s) % 6 : mx === gr ? (bl - r) / s + 2 : (r - gr) / s + 4;
  return (h * 60 + 360) % 360;
}
function applyNeon() {
  if (prefs.neon !== null) targetHue = prefs.neon;
  else if (tracks[idx]) setPaletteFromArt(tracks[idx]);
  else targetHue = 340;
  savePrefs(); markSw();
}
$("pop").addEventListener("click", e => {
  const th = e.target.closest("[data-th]");
  if (th) { prefs.theme = th.dataset.th; savePrefs(); applyTheme(); return; }
  const n = e.target.closest("button[data-n]");
  if (n) { prefs.neon = n.dataset.n === "auto" ? null : +n.dataset.n; applyNeon(); }
});
$("pop").addEventListener("input", e => {
  if (e.target.id === "cust") { prefs.neon = Math.round(hexToHue(e.target.value)); applyNeon(); }
});
const setPop = o => { $("pop").classList.toggle("open", o); $("setBtn").setAttribute("aria-expanded", o); };
$("setBtn").onclick = () => setPop(!$("pop").classList.contains("open"));
document.addEventListener("click", e => { if (!e.target.closest("#pop,#setBtn")) setPop(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") setPop(false); });

/* ---------- цветовая гамма ---------- */
let hue = prefs.neon ?? 340, targetHue = hue, spread = prefs.neon !== null ? 30 : 57;
function hashHue(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; }
function setPaletteFromArt(t) {
  if (prefs.neon !== null) { targetHue = prefs.neon; return; } // выбран свой неон
  targetHue = hashHue(t.id + t.title); // запасной вариант
  if (!t.art) return;
  const im = new Image(); im.crossOrigin = "anonymous";
  im.onload = () => {
    try {
      const c = document.createElement("canvas"); c.width = c.height = 16;
      const g = c.getContext("2d"); g.drawImage(im, 0, 0, 16, 16);
      const d = g.getImageData(0, 0, 16, 16).data; let x = 0, y = 0, w = 0;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i] / 255, gg = d[i + 1] / 255, b = d[i + 2] / 255, mx = Math.max(r, gg, b), mn = Math.min(r, gg, b), s = mx - mn;
        if (s < .12 || mx < .2) continue;
        let h = mx === r ? ((gg - b) / s) % 6 : mx === gg ? (b - r) / s + 2 : (r - gg) / s + 4;
        h = (h * 60 + 360) % 360; const a = h * Math.PI / 180;
        x += Math.cos(a) * s; y += Math.sin(a) * s; w += s;
      }
      if (w > 1) targetHue = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    } catch (e) {}
  };
  im.src = t.art;
}

/* ---------- живой шар ---------- */
const cv = $("orb"), g = cv.getContext("2d");
const N = 120, lv = new Float32Array(64); let scale = .8, size = 300, bass = 0, simT = 0;
function resize() {
  const d = Math.min(devicePixelRatio || 1, 2), r = cv.getBoundingClientRect();
  size = r.width; cv.width = cv.height = Math.round(size * d); g.setTransform(d, 0, 0, d, 0, 0);
}
new ResizeObserver(resize).observe(cv);

function blob(cx, cy, R, ph, amp, t, fill) {
  const p = [];
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2, k = i < N / 2 ? i / (N / 2) : (N - i) / (N / 2);
    const v = lv[Math.min(63, Math.floor(k * 48))];
    const n = Math.sin(a * 3 + t * .0009 + ph) * .05 + Math.sin(a * 5 - t * .0013 + ph * 2) * .035 + Math.sin(a * 2 + t * .0006 - ph) * .04;
    const r = R * (1 + n + amp * v * .5);
    p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
  }
  g.beginPath();
  const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  let s = m(p[N - 1], p[0]); g.moveTo(s[0], s[1]);
  for (let i = 0; i < N; i++) { const e = m(p[i], p[(i + 1) % N]); g.quadraticCurveTo(p[i][0], p[i][1], e[0], e[1]); }
  g.closePath(); g.fillStyle = fill; g.fill();
}

function frame(t) {
  requestAnimationFrame(frame);
  const playing = !audio.paused;
  // спектр: настоящий или имитация
  if (analyser && !fake && playing) analyser.getByteFrequencyData(data);
  else if (playing) {
    simT += .016; const beat = Math.pow(Math.max(0, Math.sin(simT * 7.5)), 4);
    for (let i = 0; i < 64; i++) data[i] = 255 * Math.min(1, (.25 + .35 * beat * (1 - i / 80) + .2 * Math.abs(Math.sin(simT * 2 + i * .6)) * (1 - i / 90)));
  } else for (let i = 0; i < 64; i++) data[i] *= .9;
  for (let i = 0; i < 64; i++) lv[i] += (data[i] / 255 - lv[i]) * .35;
  let b = 0; for (let i = 0; i < 6; i++) b += lv[i]; b /= 6; bass += (b - bass) * .4;

  // плавная смена цвета
  let df = ((targetHue - hue + 540) % 360) - 180; hue = (hue + df * .035 + 360) % 360;
  spread += ((prefs.neon !== null ? 30 : 57) - spread) * .05;
  const c1 = `hsl(${hue} 92% 62%)`, c2 = `hsl(${(hue + spread) % 360} 92% 60%)`, c3 = `hsl(${(hue - spread + 360) % 360} 95% 66%)`;
  const root = document.documentElement.style;
  root.setProperty("--c1", c1); root.setProperty("--c2", c2); root.setProperty("--c3", c3); root.setProperty("--bass", bass.toFixed(3));

  // шар
  scale += ((playing ? 1 + bass * .12 : .8) - scale) * .08;
  const cx = size / 2, cy = size / 2, R = size * .3 * scale;
  g.clearRect(0, 0, size, size);
  g.globalCompositeOperation = "source-over";
  const gl = g.createRadialGradient(cx, cy, R * .5, cx, cy, size * .5);
  gl.addColorStop(0, `hsl(${hue} 90% 60% / ${.35 + bass * .4})`); gl.addColorStop(1, "transparent");
  g.fillStyle = gl; g.fillRect(0, 0, size, size);

  const mk = (col, x, y) => { const q = g.createRadialGradient(cx + x, cy + y, R * .1, cx, cy, R * 1.35); q.addColorStop(0, col); q.addColorStop(1, "transparent"); return q; };
  const amp = playing ? 1 : .12;
  g.globalCompositeOperation = isLight ? "source-over" : "lighter";
  blob(cx, cy, R * 1.02, 0, amp, t, mk(c3, -R * .4, -R * .3));
  blob(cx, cy, R * .98, 2.1, amp * .9, t * 1.1, mk(c2, R * .4, R * .3));
  g.globalCompositeOperation = "source-over";
  blob(cx, cy, R * .9, 4.2, amp * .7, t * .9, mk(c1, -R * .2, -R * .3));

  // стеклянный блик
  const sp = g.createRadialGradient(cx - R * .38, cy - R * .45, 0, cx - R * .38, cy - R * .45, R * .75);
  sp.addColorStop(0, "rgba(255,255,255,.65)"); sp.addColorStop(.5, "rgba(255,255,255,.12)"); sp.addColorStop(1, "transparent");
  g.beginPath(); g.arc(cx, cy, R * .86, 0, 7); g.fillStyle = sp; g.fill();
  g.beginPath(); g.arc(cx, cy, R * .9, Math.PI * 1.05, Math.PI * 1.6);
  g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = 2; g.lineCap = "round"; g.stroke();
}
applyTheme(); buildSwatches(); markSw(); resize(); syncPlayState(); requestAnimationFrame(frame);
load("/tracks/trending");
</script>
